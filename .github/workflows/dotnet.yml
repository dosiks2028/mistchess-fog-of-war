name: .NET tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore solution
        run: dotnet restore MistChess.sln
      - name: Run tests
        run: dotnet test MistChess.sln --no-restore --configuration Release --verbosity minimal
      - name: Build deployment container
        run: docker build --file Dockerfile --tag mistchess-fog-of-war:ci .
      - name: Smoke-test deployment container
        run: |
          docker run --detach --name mistchess-web -p 8080:8080 -e PORT=8080 mistchess-fog-of-war:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/health; then
              curl --fail --silent http://127.0.0.1:8080/ > /dev/null
              exit 0
            fi
            sleep 2
          done
          docker logs mistchess-web
          exit 1
      - name: Stop deployment container
        if: always()
        run: docker stop mistchess-web || true
      - name: Build Vercel container
        run: docker build --file Dockerfile.vercel --tag mistchess-fog-of-war:vercel-ci .
      - name: Smoke-test Vercel container
        run: |
          docker run --detach --name mistchess-vercel-web -p 8081:80 -e PORT=80 mistchess-fog-of-war:vercel-ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8081/health; then
              curl --fail --silent http://127.0.0.1:8081/ > /dev/null
              exit 0
            fi
            sleep 2
          done
          docker logs mistchess-vercel-web
          exit 1
      - name: Stop Vercel container
        if: always()
        run: docker stop mistchess-vercel-web || true
