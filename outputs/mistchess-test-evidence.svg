  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1450" cy="80" r="260" fill="#25445a" opacity=".22"/>
  <circle cx="120" cy="820" r="300" fill="#1b6954" opacity=".12"/>

