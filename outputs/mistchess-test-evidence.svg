<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">MistChess Phase 1 automated test results</title>
  <desc id="desc">A presentation graphic showing the actual dotnet test command and output: 60 passed, 0 failed, 0 skipped, in 168 milliseconds on .NET 8.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
