  <text x="154" y="455" fill="#d5e0e8" font-family="Consolas, 'Courier New', monospace" font-size="19">.\work\dotnet8\dotnet.exe test .\MistChess.sln --no-restore --verbosity minimal</text>
  <text x="154" y="515" fill="#aebdca" font-family="Consolas, 'Courier New', monospace" font-size="20">Пройдено!  Ошибок: 0, пройдено: 60, пропущено: 0, всего: 60</text>
