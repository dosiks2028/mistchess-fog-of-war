  <text x="190" y="338" fill="#e0e8ef" font-family="Segoe UI, Arial, sans-serif" font-size="20">Windows PowerShell</text>
  <text x="1360" y="338" fill="#d5dee6" font-family="Segoe UI, Arial, sans-serif" font-size="20">—　□　×</text>

